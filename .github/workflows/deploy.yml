name: Deploy to GitHub Pages

# PUBLISHING MODEL
#
# `main` is the working branch — commit freely without publishing.
# Publishing is one command and needs no branch switching:
#
#     git push origin main:live
#
# `live` is only ever fast-forwarded from `main`; never commit to it directly.
# workflow_dispatch re-runs a deploy without a new commit.
on:
  push:
    branches: [live]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never let two deploys race. Queue rather than cancel, so a publish is not
# silently dropped by a later one.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Before setup-node, so its yarn cache resolution sees Yarn 4 rather than
      # the Yarn 1 shim. The `packageManager` field in package.json pins it.
      - name: Enable corepack
        run: corepack enable

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn

      - name: Install
        run: yarn install --immutable

      # Accessibility and type gate. A contrast regression or a type error
      # fails the deploy here rather than reaching production.
      - name: Checks
        run: yarn check

      - name: Build
        run: yarn build

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
