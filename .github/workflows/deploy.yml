name: Deploy to GitHub Pages

# PUBLISHING MODEL
#
# `main` is the working branch — commit freely without publishing.
# Publishing is one command and needs no branch switching:
#
#     git push origin main:live
#
# `live` is only ever fast-forwarded from `main`; never commit to it directly.
# workflow_dispatch re-runs a deploy without a new commit.
on:
  push:
    branches: [live]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never let two deploys race. Queue rather than cancel, so a publish is not
# silently dropped by a later one.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Before setup-node, so its yarn cache resolution sees Yarn 4 rather than
      # the Yarn 1 shim. The `packageManager` field in package.json pins it.
      - name: Enable corepack
        run: corepack enable

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: yarn

      - name: Install
        run: yarn install --immutable

      # Token contrast and type gate. A palette regression or a type error
      # fails the deploy here rather than reaching production.
      - name: Checks
        run: yarn check

      # PUBLIC_DIRECTUS_URL is a repository *variable*, not a secret: it is a
      # public unauthenticated endpoint, and the value is compiled into a
      # script every visitor downloads, so there would be nothing to hide.
      # Leaving it unset is a supported state — the impact band is left out of
      # the build entirely rather than shipping broken.
      - name: Build
        env:
          PUBLIC_DIRECTUS_URL: ${{ vars.PUBLIC_DIRECTUS_URL }}
        run: yarn build

      # The WCAG gate runs against the built output, so the browser has to be
      # ready after the build. Cache keyed on the resolved Playwright version,
      # since the browser build is tied to the Playwright release — an
      # unrelated dependency bump should not discard a 115MB download.
      - name: Resolve Playwright version
        id: pw
        run: |
          echo "version=$(node -p "require('./node_modules/playwright/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Cache Chromium
        id: playwright-cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ steps.pw.outputs.version }}-chromium

      - name: Install Chromium for the accessibility gate
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: yarn playwright install --with-deps chromium

      # A cache hit restores the browser binary but not the system libraries it
      # links against — those live outside the cached path.
      - name: Install browser system libraries
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: yarn playwright install-deps chromium

      # Fails the deploy on any WCAG 2.2 AA violation. This is the enforcement
      # behind the accessibility requirement in AGENTS.md — without it, the
      # commitment depends on someone remembering to audit by hand.
      - name: Accessibility gate
        run: yarn check:a11y

      # Renders /app to dist/share-meals-app.pdf. It has to run after the build
      # and before the upload, because the PDF is a build output rather than a
      # checked-in asset — see the note at the top of scripts/build-pdf.mjs.
      # Reuses the Chromium installed above for the accessibility gate.
      - name: Printable one-pager
        run: yarn build:pdf

      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
