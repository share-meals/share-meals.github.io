name: Deploy to GitHub Pages

# PUBLISHING MODEL
#
# `main` is the working branch — commit freely without publishing.
# Publishing is one command and needs no branch switching:
#
#     git push origin main:live
#
# `live` is only ever fast-forwarded from `main`; never commit to it directly.
# workflow_dispatch re-runs a deploy without a new commit.
on:
  push:
    branches: [live]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never let two deploys race. Queue rather than cancel, so a publish is not
# silently dropped by a later one.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Before setup-node, so its yarn cache resolution sees Yarn 4 rather than
      # the Yarn 1 shim. The `packageManager` field in package.json pins it.
      - name: Enable corepack
        run: corepack enable

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: yarn

      - name: Install
        run: yarn install --immutable

      # Token contrast and type gate. A palette regression or a type error
      # fails the deploy here rather than reaching production.
      - name: Checks
        run: yarn check

      - name: Build
        run: yarn build

      # The WCAG gate runs against the built output, so it has to come after
      # the build. Only Chromium is installed, and `--with-deps` pulls the
      # system libraries the headless browser needs on a bare runner.
      - name: Install Chromium for the accessibility gate
        run: yarn playwright install --with-deps chromium

      # Fails the deploy on any WCAG 2.2 AA violation. This is the enforcement
      # behind the accessibility requirement in AGENTS.md — without it, the
      # commitment depends on someone remembering to audit by hand.
      - name: Accessibility gate
        run: yarn check:a11y

      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
